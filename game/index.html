<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gilded Hour — Museum Heist</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #070b16; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  .frame {
    padding: 0;
    border: 0;
    background: transparent;
    box-shadow: none;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    background: #0b1224;
    border: 0;
  }
  .hint {
    display: none;
  }
  .hint b { color: #d4af37; }
</style>
</head>
<body>
<div class="frame">
  <canvas id="game" width="1280" height="720"></canvas>
  <p class="hint">WASD / panah bergerak &nbsp;·&nbsp; <b>Space</b> pakai tool &nbsp;·&nbsp; <b>1/2/3</b> pilih tool &nbsp;·&nbsp; <b>Shift</b> jalan pelan</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
